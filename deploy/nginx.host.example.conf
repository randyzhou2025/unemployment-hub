# 宿主机 Nginx 的独立站点配置。
# 替换两个域名；证书须覆盖对应域名，文件路径见部署文档。
# 本模板假设 Nginx 直接接收互联网 HTTPS 请求，没有额外 CDN/负载均衡。
server {
    listen 80;
    server_name api.your-domain.example admin.your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.your-domain.example;
    ssl_certificate /etc/nginx/ssl/unemployment-hub-api/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/unemployment-hub-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 120k;
    add_header X-Content-Type-Options nosniff always;

    # 管理接口由后台域名访问，公开 API 域名不提供管理入口。
    location ^~ /api/v1/admin {
        return 404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name admin.your-domain.example;
    ssl_certificate /etc/nginx/ssl/unemployment-hub-admin/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/unemployment-hub-admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 120k;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
